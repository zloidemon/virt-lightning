[images]

# DragonFlyBSD

[images.dragonflybsd]
url = "https://object-storage.public.mtl1.vexxhost.net/swift/v1/1dbafeefbd4f4c80864414a441e72dd2/bsd-cloud-image.org/images/dragonflybsd/{rel}"
file = "dragonflybsd-{rel}.qcow2"
base = [
  {tag = "5.8.3", rel = "5.8.3"},
  {tag = "6.0.0", rel = "6.0.0"},
  {tag = "6.0.0-ufs", rel = "6.0.0", file = "dragonflybsd-{rel}.qcow2"},
  {tag = "6.0.0-hammer2", rel = "6.0.0", file = "dragonflybsd-{rel}.qcow2"},
  {tag = "6.0.1-ufs", rel = "6.0.1", date = "2021-12-11", file = "{date}/dragonflybsd-{tag}.qcow2"},
  {tag = "6.0.1-hammer2", rel = "6.0.1", date = "2021-12-11", file = "{date}/dragonflybsd-{tag}.qcow2"},
  {tag = "6.0.2-ufs", rel = "6.0.2", date = "2022-09-06", file = "{date}/dragonflybsd-{tag}-{date}.qcow2"},
  {tag = "6.0.2-hammer2", rel = "6.0.2", date = "2022-09-06", file = "{date}/dragonflybsd-{tag}-{date}.qcow2"},
  {tag = "6.4.0-ufs", rel = "6.4.0", date = "2022-04-23", file = "{date}/dragonflybsd-{tag}-{date}.qcow2"},
  {tag = "6.4.0-hammer2", rel = "6.4.0", date = "2022-04-23", file = "{date}/dragonflybsd-{tag}-{date}.qcow2"},
]

