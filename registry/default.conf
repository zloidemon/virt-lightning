map_hash_bucket_size 256;
map $request_uri $new_uri {
    include /etc/angie/images.map;
}
    
server {
    listen       80;
    server_name  localhost;

    if ($new_uri) {
       return 301 $new_uri;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/angie/html;
    }
}
